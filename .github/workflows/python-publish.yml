name: Python_Publish

# Publishes to PyPI via Trusted Publishing (OIDC) -- no API token is stored in this repo.
# One-time setup: add a trusted publisher for this repository and workflow at
# https://pypi.org/manage/project/dualperspective/settings/publishing/
#
# IMPORTANT: only run this once the Julia version pinned in pypi/src/DualPerspective/
# juliapkg.json has been registered in the General registry. Publishing earlier ships a
# wheel whose pinned Julia dependency cannot be resolved.
on:
  push:
    tags:
      - 'py-v*'
  workflow_dispatch:
    inputs:
      repository:
        description: 'Target index'
        required: true
        default: 'testpypi'
        type: choice
        options:
          - testpypi
          - pypi

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build
        working-directory: pypi
        run: |
          python -m pip install --upgrade build twine
          rm -rf build dist ./*.egg-info src/*.egg-info
          python -m build

      - name: Verify the Julia pin shipped
        working-directory: pypi
        run: |
          python -m zipfile -l dist/*.whl | grep -q 'DualPerspective/juliapkg.json' \
            || { echo "::error::juliapkg.json missing from the wheel"; exit 1; }
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: pypi/dist/

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: github.event_name == 'push' || inputs.repository == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
