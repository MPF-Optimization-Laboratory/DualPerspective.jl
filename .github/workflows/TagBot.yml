name: TagBot
on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
    inputs:
      lookback:
        default: "3"
permissions:
  actions: read
  checks: read
  contents: write
  deployments: read
  issues: read
  discussions: read
  packages: read
  pages: read
  pull-requests: read
  repository-projects: read
  security-events: read
  statuses: read
jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Tag pushes made with GITHUB_TOKEN do not trigger other workflows, so without
          # this the `tags: '*'` trigger in docs.yml never fires and versioned docs are
          # never published. Pushing the tag over SSH instead does trigger it.
          ssh: ${{ secrets.DOCUMENTER_KEY }}
          # Edit the following line to reflect your package registry:
          registry: JuliaRegistries/General