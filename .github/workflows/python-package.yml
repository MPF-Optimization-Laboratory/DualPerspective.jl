name: Python_Package

on:
  push:
    branches:
      - main
    paths:
      - 'pypi/**'
      - '.github/workflows/python-package.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'pypi/**'
      - '.github/workflows/python-package.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build
        working-directory: pypi
        run: |
          python -m pip install --upgrade build twine
          rm -rf build dist ./*.egg-info src/*.egg-info
          python -m build

      # juliapkg.json is what pins the Julia dependency. If package-data ever stops
      # including it, juliacall falls back to an unpinned resolve and this package loses the
      # only guarantee it makes.
      - name: Assert juliapkg.json is in the wheel
        working-directory: pypi
        run: |
          python -m zipfile -l dist/*.whl | grep -q 'DualPerspective/juliapkg.json' \
            || { echo "::error::juliapkg.json missing from the wheel"; exit 1; }
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: pypi/dist/

  test:
    name: Python ${{ matrix.python-version }} - ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Install the built wheel rather than the source tree, so what CI exercises is what
      # users receive.
      - name: Install wheel
        run: python -m pip install dist/*.whl pytest

      # The pinned Julia version is not registered until release, so tests run against this
      # checkout. The pin itself is asserted by tests/test_bootstrap.py.
      - name: Run tests
        working-directory: pypi
        env:
          DUALPERSPECTIVE_JL_PATH: ${{ github.workspace }}
        run: python -m pytest tests -v

      - name: Run doctor
        working-directory: pypi
        env:
          DUALPERSPECTIVE_JL_PATH: ${{ github.workspace }}
        run: python -m DualPerspective.doctor
